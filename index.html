<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <!-- Compatibility patch to prevent: Cannot set property fetch of #<Window> which has only a getter -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchValue = originalFetch;
          // Redefine window.fetch with a custom getter and setter to absorb reassignment attempts safely
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchValue || originalFetch;
            },
            set: function(val) {
              fetchValue = val || originalFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Failed to initialize window.fetch setter safety shim:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
